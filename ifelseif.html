<html>
<head> <title> Lesson 2: If-Else-If </title>
<style type="text/css">
		*{		               
                b, strong {
                        font-weight: bold;
                }
                i, em {
                        font-style: italic;
                }
                u {
                        text-decoration: underline
                }

</style>
<script type="text/javascript">
function check()
{ 
if (document.example.answer.value=="FAIRNESS") 
{alert("Fairness is the correct answer!");} 
else if (document.example.answer.value=="") 
{alert("No answer was recorded. Try again!");} 
else {alert("Not quite. Try again!");}
} 
</script>

<hr width="1300" size="5" noshade="noshade"/>

<center> <form name="example"> <input type="text" name="answer" value=""> 
<input type="button" name="answerbutton" value="SUBMIT" onClick=check()> 
</form>
</center>
