<html>
<head> <title> CSS Styling </title>
<style type="text/css">
		*{
		li a{
			color: white; font-size: 15px; font-weight: bold; margin-right: 15px;
		}		               
                b, strong {
                        font-weight: bold;
                }
                i, em {
                        font-style: italic;
                }
                u {
                        text-decoration: underline
                }
                .button-container {
                         text-align: center; margin-top: 50px; 
                }
                button {
                         width: 200px; height: 70px; font-size: 20px; background-color: #f2f3a3; color: white; border: none; border-radius: 5px; cursor: pointer; 
                          line-height: 70px; 
                }
                button:hover {
                         background-color: #d9dac6;
                }
                button a {
                         text-decoration: none; color: black;
                }
</style> 
</head>
<body>
<div>
<h1 align="center"> Inline Style (Basic CSS Styling) </h1>
<hr width="1300" size="5" noshade="noshade"/>
<p style="text-align:center; color:#0a63d6; font-family:Courier New;"> In this webpage, CSS inline style can be found. If we check the code, 
we can see that the style is applied on the tag itself. This inline style is what causes this paragraph to have Courier New font and a blue color. </p>
</div>
